services:
  portal:
    build: .
    env_file: .env
    environment:
      TZ: Europe/Moscow
      ASPNETCORE_URLS: http://0.0.0.0:5080
    volumes:
      - ./data/db:/var/lib/tsd-portal/db
      - ./data/catalog:/var/lib/tsd-portal/catalog
      - ./data/secrets:/var/lib/tsd-portal/secrets
      - ./seed:/var/lib/tsd-portal/seed:ro
      - ./certs/portal.crt:/certs/portal.crt:ro
      - ./certs/portal.key:/certs/portal.key:ro
    expose:
      - "5080"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - portal
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/certs:ro
    restart: unless-stopped
